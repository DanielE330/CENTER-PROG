rules:
  - id: no-raw-print
    message: Use structured logging; print may leak sensitive values
    languages: [python]
    severity: ERROR
    pattern: print(...)
    paths:
      include: ["services/", "py/"]
      exclude: ["**/tests/**"]
  - id: no-println-in-services
    message: Use tracing; println may leak sensitive values
    languages: [rust]
    severity: ERROR
    pattern-either:
      - pattern: println!(...)
      - pattern: eprintln!(...)
  - id: logging-purpose-or-inn
    message: Do not log payment purposes, names or INN
    languages: [python]
    severity: ERROR
    pattern-either:
      - pattern: log.$F(..., $X["purpose"], ...)
      - pattern: log.$F(..., $X["counterparty_name"], ...)
      - pattern: log.$F(..., $X.inn, ...)
