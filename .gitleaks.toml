# gitleaks: стандартные правила плюс исключения для не-секретов.
[extend]
useDefault = true

[allowlist]
description = "Не секреты: чужой проект gleb/, датасет, сборки, зависимости, выгрузка чата"
paths = [
  '''^gleb/''',
  '''^data/''',
  '''^docs/ChatExport_''',
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)dist/''',
  '''(^|/)\.venv/''',
  '''package-lock\.json$''',
  '''uv\.lock$''',
  '''Cargo\.lock$''',
]
# Демо-пароль из README и скриптов — публичный по замыслу (DEMO_SEED=1).
regexes = ['''demo12345''']
