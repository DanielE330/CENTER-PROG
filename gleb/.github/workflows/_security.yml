name: security
on:
  workflow_call:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secrets in history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: SAST (semgrep)
        run: |
          pipx run semgrep==1.182.1 scan --config p/rust --config p/python --config p/typescript --config p/secrets \
            --config .semgrep --sarif --output semgrep.sarif --error --metrics off
      # Code scanning needs GitHub Advanced Security on a private repo; until the repo is public
      # the findings stay in the job log and the SAST step above still fails the job.
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
      - name: Config and filesystem (trivy)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.1 fs --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL --exit-code 1 --skip-dirs /src/data /src
      - name: Dockerfiles (hadolint)
        run: docker run --rm -v "$PWD:/src" -w /src hadolint/hadolint:v2.15.1 hadolint --ignore DL3008 deploy/docker/rust.Dockerfile deploy/docker/python.Dockerfile deploy/docker/advisor.Dockerfile deploy/docker/web.Dockerfile
      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/src" -w /src rhysd/actionlint:1.7.12 -color
      - name: Shell scripts (shellcheck)
        run: shellcheck -s sh deploy/scripts/*.sh deploy/caddy/*.sh && shellcheck deploy/postgres/*.sh deploy/keycloak/*.sh
