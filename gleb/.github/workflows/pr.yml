name: pr
on:
  pull_request:
    branches: [tested, backend, frontend, ml, infra]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust:
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
  python:
    uses: ./.github/workflows/_python.yml
    permissions:
      contents: read
  web:
    uses: ./.github/workflows/_web.yml
    permissions:
      contents: read
  security:
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      security-events: write
