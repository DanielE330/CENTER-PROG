name: web
on:
  workflow_call:

permissions: {}

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: npm install -g pnpm@12.15.0 --no-fund --no-audit && pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
