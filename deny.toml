# cargo-deny для backend workspace: лицензии, известные уязвимости, запрещённые крейты, источники.
# Запуск: cd backend && cargo deny --manifest-path Cargo.toml --config ../deny.toml check   (в CI: .github/workflows/rust.yml)
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "0BSD", "BSL-1.0"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ name = "openssl-sys", reason = "TLS только через rustls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
