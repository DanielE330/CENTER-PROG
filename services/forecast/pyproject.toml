[project]
name = "forecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ci-common",
  "numpy>=2",
  "pandas>=2.2",
]

[tool.uv.sources]
ci-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]
