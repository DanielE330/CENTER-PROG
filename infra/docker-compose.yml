# Запуск: make -C infra up (контекст сборки — корень репозитория)
x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-pyhealth: &pyhealth
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

x-rshealth: &rshealth
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  auth:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: auth}
    environment:
      AUTH_DB: /data/auth.db
      DEMO_SEED: ${DEMO_SEED:-1}
      # тестовый вход (кнопки на странице входа): auth снимает у демо-сотрудников обязательную смену пароля и создаёт директора с этим паролем
      DEMO_LOGIN: ${DEMO_LOGIN:-${DEMO_SEED:-1}}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
      # ключ шифрования секретов TOTP (пусто — файл mfa.key в томе); AUTH_REQUIRE_2FA=1 — 2FA для всех, кто входит по паролю
      AUTH_MFA_KEY: ${AUTH_MFA_KEY:-}
      AUTH_REQUIRE_2FA: ${AUTH_REQUIRE_2FA:-0}
    volumes: [auth-data:/data]
    networks: [internal]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/live', timeout=2)"]

  parser:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: parser}
    networks: [internal]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/live', timeout=2)"]

  gov:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: gov}
    # единственный сервис с выходом наружу: ходит на cbr.ru, nalog.gov.ru, xmlcalendar.ru
    networks: [internal, edge]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8003/live', timeout=2)"]

  ecp:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: ecp}
    environment:
      ECP_DEBUG_DUMP: ${ECP_DEBUG_DUMP:-0}
      ECP_DB: /data/ecp.db
      AUTH_URL: http://auth:8001
    volumes: [ecp-data:/data]
    networks: [internal]
    depends_on:
      auth: {condition: service_healthy}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8007/live', timeout=2)"]

  onec:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: onec}
    environment:
      MOCK_TODAY: ${MOCK_TODAY:-2026-09-29}
      MOCK_DATASET_DIR: /dataset
    networks: [internal]
    volumes: ["${DATASET_DIR:-../data/demo}:/dataset:ro"]  # данные для имитаторов: демо-выборка из репозитория или полный датасет (DATASET_DIR=../data/dataset)
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8004/live', timeout=2)"]

  edo:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: edo}
    environment:
      MOCK_TODAY: ${MOCK_TODAY:-2026-09-29}
      MOCK_DATASET_DIR: /dataset
    networks: [internal]
    volumes: ["${DATASET_DIR:-../data/demo}:/dataset:ro"]  # данные для имитаторов: демо-выборка из репозитория или полный датасет (DATASET_DIR=../data/dataset)
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8005/live', timeout=2)"]

  bank:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: bank}
    environment:
      MOCK_TODAY: ${MOCK_TODAY:-2026-09-29}
      MOCK_DATASET_DIR: /dataset
    networks: [internal]
    volumes: ["${DATASET_DIR:-../data/demo}:/dataset:ro"]  # данные для имитаторов: демо-выборка из репозитория или полный датасет (DATASET_DIR=../data/dataset)
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8006/live', timeout=2)"]

  demo-feed:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: demo_feed}
    # лента демо «Прошла неделя»: операции датасета после даты отсечки, только во внутренней сети
    environment:
      DEMO_DATASET_DIR: /dataset
      DEMO_COMPANY: ${DEMO_COMPANY:-C001}
      DEMO_CUTOFF: ${DEMO_CUTOFF:-2026-07-12}
    networks: [internal]
    volumes: ["${DATASET_DIR:-../data/demo}:/dataset:ro"]  # тот же датасет, из которого seed_demo.sh грузит выписку
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8012/live', timeout=2)"]

  fns-sim:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: fns_sim}
    # имитатор источников ФНС (ЕНС, реестры контрагентов): данные из датасета, детерминированы по ИНН; только внутренняя сеть
    environment:
      MOCK_TODAY: ${MOCK_TODAY:-2026-09-29}
      MOCK_DATASET_DIR: /dataset
      FNS_SIM_TOKEN: ${FNS_SIM_TOKEN:-fns-sim-demo}
    networks: [internal]
    volumes: ["${DATASET_DIR:-../data/demo}:/dataset:ro"]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8016/live', timeout=2)"]

  fns:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: fns}
    # сведения ФНС. FNS_MODE=sim (по умолчанию) работает без сети через fns-sim. Режим live (реальные открытые источники)
    # выключен: включается FNS_MODE=live и файлом docker-compose.fns-live.yml, который даёт сервису выход наружу (docs/fns.md)
    environment:
      FNS_MODE: ${FNS_MODE:-sim}
      FNS_DB: /data/fns.db
      FNS_SIM_URL: http://fns-sim:8016
      FNS_SIM_TOKEN: ${FNS_SIM_TOKEN:-fns-sim-demo}
      GOV_URL: http://gov:8003
      FNS_CONTACT: ${FNS_CONTACT:-https://github.com/DanielE330/CI-hack}
      FNS_MIN_INTERVAL: ${FNS_MIN_INTERVAL:-1.0}
      FNS_CACHE_TTL: ${FNS_CACHE_TTL:-86400}
    volumes: [fns-data:/data]
    networks: [internal]
    depends_on:
      fns-sim: {condition: service_healthy}
      gov: {condition: service_healthy}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8015/live', timeout=2)"]

  integrator:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: integrator}
    # по умолчанию ходит в имитаторы 1С/ЭДО/банка; с ONEC_URL из infra/.env — в настоящую 1С (например, 1С:Фреш),
    # поэтому у integrator есть выход наружу (edge)
    environment:
      ONEC_URL: ${ONEC_URL:-http://onec:8004}
      ONEC_USER: ${ONEC_USER:-demo}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-demo}
      EDO_URL: http://edo:8005
      BANK_URL: http://bank:8006
      MOCK_TODAY: ${MOCK_TODAY:-2026-09-29}
      INTEGRATOR_TODAY: ${INTEGRATOR_TODAY:-${MOCK_TODAY:-2026-09-29}}
      INTEGRATOR_TIMEOUT: ${INTEGRATOR_TIMEOUT:-30}
    networks: [internal, edge]
    depends_on:
      onec: {condition: service_healthy}
      edo: {condition: service_healthy}
      bank: {condition: service_healthy}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8008/live', timeout=2)"]

  llm-gateway:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: llm_gateway}
    # единственный сервис с выходом к облачным LLM (edge). Ключи только из окружения хоста/infra/.env, в репозитории их нет.
    # Без LLM_PROVIDER и ключа консультант отвечает шаблоном из прогноза.
    environment:
      LLM_GATEWAY_DB: /data/llm_gateway.db
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-200000}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes: [llm-gateway-data:/data]
    networks: [internal, edge]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8010/live', timeout=2)"]

  advisor:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: advisor}
    # консультант читает ledger/forecast/planfact и вызывает llm-gateway; сам ничего не записывает
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8010
      LEDGER_URL: http://ledger:3002
      FORECAST_URL: http://forecast:3003
      PLANFACT_URL: http://planfact:3004
    networks: [internal]
    depends_on:
      llm-gateway: {condition: service_healthy}
      ledger: {condition: service_healthy}
      forecast: {condition: service_healthy}
      planfact: {condition: service_healthy}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8011/live', timeout=2)"]

  backoffice:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: backoffice}
    # панель оператора платформы: операторы, сессии, журнал действий и прокси к ledger/forecast/auth. Только внутренняя сеть.
    # Первый оператор создаётся из OPERATOR_EMAIL/OPERATOR_PASSWORD (infra/.env, не коммитится) или командой
    # docker compose -f infra/docker-compose.yml exec backoffice python -m backoffice.create_operator <email>
    environment:
      BACKOFFICE_DB: /data/backoffice.db
      LEDGER_URL: http://ledger:3002
      FORECAST_URL: http://forecast:3003
      AUTH_URL: http://auth:8001
      NOTIFY_URL: http://notify:8014
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      # второй фактор оператора (TOTP) обязателен; секреты шифруются ключом BACKOFFICE_MFA_KEY (пусто — ключ-файл в томе backoffice-data)
      BACKOFFICE_REQUIRE_2FA: ${BACKOFFICE_REQUIRE_2FA:-1}
      BACKOFFICE_MFA_KEY: ${BACKOFFICE_MFA_KEY:-}
    volumes: [backoffice-data:/data]
    networks: [internal]
    depends_on:
      auth: {condition: service_healthy}
      ledger: {condition: service_healthy}
      forecast: {condition: service_healthy}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8013/live', timeout=2)"]

  notifier:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: notifier}
    # Расписание уведомлений: Telegram-бот (api.telegram.org, сеть edge) и почта (через notify). Без TELEGRAM_BOT_TOKEN
    # бот выключен, а алерты и отчёты всё равно уходят на почту участникам, у которых она включена.
    environment:
      NOTIFIER_DB: /data/notifier.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # консультант Hermes (OpenAI-совместимый API, лучше свой сервер: в запрос уходит статистика компании); пусто — только правила
      HERMES_URL: ${HERMES_URL:-}
      HERMES_MODEL: ${HERMES_MODEL:-NousResearch/Hermes-3-Llama-3.1-8B}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      LEDGER_URL: http://ledger:3002
      FORECAST_URL: http://forecast:3003
      PLANFACT_URL: http://planfact:3004
      NOTIFY_URL: http://notify:8014
    volumes: [notifier-data:/data]
    networks: [internal, edge]
    depends_on:
      ledger: {condition: service_healthy}
      forecast: {condition: service_healthy}
      planfact: {condition: service_healthy}
      notify: {condition: service_started}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8009/live', timeout=2)"]

  notify:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/python.Dockerfile, target: notify}
    # единственный почтовый шлюз: служебные письма (подтверждение почты, пароль, приглашения, блокировка) и почтовый канал
    # алертов и отчётов notifier. По умолчанию всё уходит в Mailpit (http://localhost:8025); реальный SMTP — SMTP_* в infra/.env.
    # Сеть mail — единственный выход наружу (к SMTP-серверу); во внутреннюю сеть notify ходит за составом компаний и статусом почты.
    environment:
      NOTIFY_DB: /data/notify.db
      LEDGER_URL: http://ledger:3002
      AUTH_URL: http://auth:8001
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}        # пусто — адрес SMTP_USER (провайдеры принимают только свой адрес отправителя)
      SMTP_HELO: ${SMTP_HELO:-}        # имя в EHLO; пусто — хост из PUBLIC_URL или домен отправителя
      SMTP_TLS_VERIFY: ${SMTP_TLS_VERIFY:-1}   # 0 — не проверять сертификат (только для своего сервера с самоподписанным)
      SMTP_CA_FILE: ${SMTP_CA_FILE:-}  # путь к корневому сертификату внутри контейнера (смонтируйте файл через override)
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      SMTP_MAX_PER_MINUTE: ${SMTP_MAX_PER_MINUTE:-30}   # лимит скорости; 0 — без лимита
      # прежние переменные notifier (.env из ura): понимаются, если новых нет
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
    volumes: [notify-data:/data]
    networks: [internal, mail]
    depends_on:
      auth: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8014/live', timeout=2)"]

  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.31.6
    # почтовый ящик для демо и разработки: ловит все письма, веб-интерфейс только с этой машины
    environment:
      MP_MAX_MESSAGES: 2000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    tmpfs: [/tmp, /data]
    networks: [mail]

  ledger:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/rust.Dockerfile, target: ledger}
    environment:
      INTERNAL_ADDR: 0.0.0.0:3002
      DB_PATH: /data/ledger.db
      PARSER_URL: http://parser:8002
    volumes: [ledger-data:/data]
    networks: [internal]
    depends_on:
      parser: {condition: service_healthy}
    healthcheck:
      <<: *rshealth
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3002/live"]

  forecast:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/rust.Dockerfile, target: forecast}
    environment:
      INTERNAL_ADDR: 0.0.0.0:3003
      DB_PATH: /data/forecast.db
      LEDGER_URL: http://ledger:3002
    volumes: [forecast-data:/data]
    networks: [internal]
    depends_on:
      ledger: {condition: service_healthy}
    healthcheck:
      <<: *rshealth
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3003/live"]

  planfact:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/rust.Dockerfile, target: planfact}
    environment:
      INTERNAL_ADDR: 0.0.0.0:3004
      LEDGER_URL: http://ledger:3002
      FORECAST_URL: http://forecast:3003
    networks: [internal]
    depends_on:
      ledger: {condition: service_healthy}
      forecast: {condition: service_healthy}
    healthcheck:
      <<: *rshealth
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3004/live"]

  web-api:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/rust.Dockerfile, target: api}
    # порты не публикуются: наружу смотрит только gateway; internal API :3100 доступен лишь внутри сети.
    # Собственной БД у api нет.
    environment:
      PUBLIC_ADDR: 0.0.0.0:3000
      INTERNAL_ADDR: 0.0.0.0:3100
      AUTH_URL: http://auth:8001
      ECP_URL: http://ecp:8007
      GOV_URL: http://gov:8003
      LEDGER_URL: http://ledger:3002
      FORECAST_URL: http://forecast:3003
      PLANFACT_URL: http://planfact:3004
      INTEGRATOR_URL: http://integrator:8008
      NOTIFIER_URL: http://notifier:8009
      ADVISOR_URL: http://advisor:8011
      DEMO_FEED_URL: http://demo-feed:8012
      BACKOFFICE_URL: http://backoffice:8013
      NOTIFY_URL: http://notify:8014
      FNS_URL: http://fns:8015
      DEMO_FEED_ENABLED: ${DEMO_FEED_ENABLED:-${DEMO_SEED:-1}}  # демо «Прошла неделя» только для demo@example.com
      # кнопки «Тестовый вход» (Директор / Редактор / Наблюдатель) на странице входа; на публичном стенде с настоящими данными: DEMO_LOGIN=0
      DEMO_LOGIN: ${DEMO_LOGIN:-${DEMO_SEED:-1}}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
      WEB_DIR: /app/frontend/dist
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks: [internal, edge]
    depends_on:
      auth: {condition: service_healthy}
      ecp: {condition: service_healthy}
      ledger: {condition: service_healthy}
      forecast: {condition: service_healthy}
      planfact: {condition: service_healthy}
      notifier: {condition: service_healthy}
      backoffice: {condition: service_started}
      notify: {condition: service_started}
      fns: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    <<: *hardening
    build: {context: .., dockerfile: infra/docker/caddy.Dockerfile}
    ports: ["${GATEWAY_PORT:-3000}:3000"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:3000}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-off}
    tmpfs: [/data, /config]
    networks: [edge]
    depends_on:
      web-api: {condition: service_healthy}

networks:
  internal: {internal: true}   # все сервисы, кроме gateway и gov/api на edge — без выхода наружу
  edge: {}                     # gateway <-> api
  mail: {}                     # notify -> SMTP (Mailpit или внешний сервер)

volumes:
  auth-data:
  ecp-data:
  ledger-data:
  forecast-data:
  notifier-data:
  llm-gateway-data:
  backoffice-data:
  notify-data:
  fns-data:
