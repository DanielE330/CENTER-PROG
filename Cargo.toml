[workspace]
resolver = "3"
members = [
  "crates/ci-core",
  "crates/ci-domain",
  "services/gateway",
  "services/tenancy",
  "services/ingest",
  "services/obligations",
  "services/alerts",
  "services/llm-gateway",
  "services/advisor-tools",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ci-core = { path = "crates/ci-core" }
ci-domain = { path = "crates/ci-domain" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "fs"] }
axum = { version = "0.8", features = ["json", "query", "multipart", "macros"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit", "util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
x509-parser = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json", "stream", "http2"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
async-nats = "0.50"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
arc-swap = "1"
futures = "0.3"
bytes = "1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
hex = "0.4"
regex = "1"
url = "2"
csv = "1"
encoding_rs = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
