---
- name: Install base packages
  ansible.builtin.apt:
    name: [podman, uidmap, slirp4netns, fuse-overlayfs, chrony, jq, age, curl, git, ansible-core]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Service user without sudo
  ansible.builtin.user:
    name: "{{ ci1_user }}"
    shell: /bin/bash
    create_home: true
    groups: []

- name: Keep user services running without a login session
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ci1_user }}"
    creates: "/var/lib/systemd/linger/{{ ci1_user }}"

- name: Journald size cap
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/ci1.conf
    content: |
      [Journal]
      SystemMaxUse=500M
    mode: "0644"
  notify: Restart journald
