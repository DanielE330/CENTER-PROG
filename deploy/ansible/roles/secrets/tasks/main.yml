---
- name: Decrypt the stand secrets
  ansible.builtin.command:
    cmd: "sops --decrypt --output-type json {{ secrets_file }}"
  register: secrets_decrypted
  changed_when: false
  no_log: true

- name: Podman secrets (mounted as files, never environment variables)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf '%s' "$VALUE" | podman secret create --replace {{ item }} -
    executable: /bin/bash
  environment:
    VALUE: "{{ (secrets_decrypted.stdout | from_json)[item] | default('') }}"
  become: true
  become_user: "{{ ci1_user }}"
  loop: "{{ secrets_names }}"
  changed_when: true
  no_log: true
