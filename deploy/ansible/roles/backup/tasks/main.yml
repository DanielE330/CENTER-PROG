---
- name: Backup script (pg_dump encrypted with age; restore tested by ci1-restore-check)
  ansible.builtin.copy:
    dest: "{{ ci1_home }}/.local/bin/ci1-backup"
    owner: "{{ ci1_user }}"
    mode: "0750"
    content: |
      #!/bin/bash
      set -euo pipefail
      dir="$HOME/backups"; mkdir -p "$dir"
      podman exec postgres pg_dumpall -U postgres | age -r "{{ ci1_backup_age_recipient }}" > "$dir/ci1-$(date +%F).sql.age"
      find "$dir" -name 'ci1-*.sql.age' -mtime +{{ ci1_backup_keep_days }} -delete
  when: ci1_backup_age_recipient | length > 0
