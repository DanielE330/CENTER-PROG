---
# Manual one-off deploy; normally the deploy agent timer does the same every 5 minutes.
- name: Deploy the latest signed release
  hosts: stand
  become: true
  tasks:
    - name: Run the deploy agent once
      ansible.builtin.systemd_service:
        name: ci1-deploy.service
        state: started
        scope: user
      become: true
      become_user: "{{ ci1_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ci1_uid }}"
