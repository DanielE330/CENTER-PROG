во) эксплуатанта) представляют налоговую декларацию за сентябрь 2026 г.;</p> <p>- налогоплательщики, имеющие свидетельство о регистрации лица, совершающего операции с прямогонным бензином, о регистрации лица, совершающего операции с бензолом, параксилолом или ортоксилолом, о регистрации организации, совершающей операции с этиловым спиртом, о регистрации лица, совершающего операции по переработке средних дистиллятов, а также включенные в Реестр эксплуатантов гражданской авиации Российской Федерации и имеющие сертификат (свидетельство) эксплуатанта, представляют налоговую декларацию за июль 2026 г.;</p> <p>- налогоплательщики, совершающие операции по реализации бункерного топлива и средних дистиллятов, включенные в реестр поставщиков бункерного топлива, представляют налоговую декларацию за апрель 2026 г.</p>  ", title:"Акцизы"},{message: "<p><strong>Водный налог:</strong></p> <p>- налогоплательщики представляют налоговую декларацию за III квартал 2026 г.</p>  ", title:"Водный налог"},{message: "<p><strong>Налог на игорный бизнес:</strong></p> <p>- налогоплательщики представляют налоговую декларацию за сентябрь 2026 г.</p>  ", title:"Налог на игорный бизнес"},{message: "<p><strong>Индивидуальный (персонифицированный) учет:</strong></p> <p>- страхователи представляют в составе формы ЕФС-1 сведения о трудовой деятельности работников в случаях их перевода на другую постоянную работу, подачи заявления о продолжении ведения страхователем трудовой книжки в соответствии со статьей 66 Трудового кодекса либо о предоставлении ему страхователем сведений о трудовой деятельности в соответствии со статьей 66.1 Трудового кодекса за сентябрь 2026 г.;</p> <p>- государственные и муниципальные учреждения, осуществляющие определенные виды деятельности, представляют в составе формы ЕФС-1 сведения о размере выплат в отношении лиц, работающих по трудовым договорам, за сентябрь 2026 г.</p>  ", title:"Индивидуальный (персонифицированный) учет"},{message: "<p><strong>Прослеживаемость товаров:</ акцизной спиртосодержащей продукции, уплачивают авансовый платеж за октябрь 2026 г. и представляют в налоговый орган документы, подтверждающие уплату авансового платежа. В целях освобождения от уплаты авансового платежа акциза налогоплательщики представляют в налоговый орган банковскую гарантию и извещение об освобождении от уплаты авансового платежа акциза</p>  ", title:"Акцизы"},{message: "<p><strong>Водный налог:</strong></p> <p>- налогоплательщики уплачивают налог за III квартал 2026 г.</p>  ", title:"Водный налог"},{message: "<p><strong>Налог на прибыль организаций:</strong></p> <p>- налоговые агенты перечисляют налог с доходов в виде дивидендов, а также процентов по государственным и муниципальным ценным бумагам, удержанный в сентябре 2026 г.;</p> <p>- налогоплательщики уплачивают налог с доходов в виде процентов по государственным и муниципальным ценным бумагам за сентябрь 2026 г.;</p> <p>- налогоплательщики уплачивают 1-й ежемесячный авансовый платеж по налогу за IV квартал 2026 г. (об организациях, уплачивающих только квартальные авансовые платежи, см. ст. 286 НК РФ);</p> <p>- налогоплательщики, для которых отчетным периодом по налогу является квартал, уплачивают авансовый платеж за 9 месяцев 2026 г.;</p> <p>- налогоплательщики, исчисляющие ежемесячные авансовые платежи исходя из фактически полученной прибыли, уплачивают авансовый платеж за сентябрь 2026 г.</p>  ", title:"Налог на прибыль организаций"},{message: "<p><strong>Торговый сбор:</strong></p> <p>- плательщики уплачивают сбор за III квартал 2026 г.</p>  ", title:"Торговый сбор"},{message: "<p><strong>Налог на профессиональный доход:</strong></p> <p>- налогоплательщики уплачивают налог за сентябрь 2026 г.</p>  ", title:"Налог на профессиональный доход"},{message: "<p><strong>Транспортный налог:</strong></p> <p>- налогоплательщики - организации уплачивают авансовый платеж за III квартал 2026 г.</p>  ", title:"Транспортный налог"},{message: "<p><strong>Налог на имущество организаций:</strong></p> <p>- ьное, пенсионное, медицинское страхование"},{message: "<p><strong>Налог на добычу полезных ископаемых:</strong></p> <p>- налогоплательщики представляют налоговую декларацию за октябрь 2026 г.</p>  ", title:"Налог на добычу полезных ископаемых"},{message: "<p><strong>Налог на игорный бизнес:</strong></p> <p>- налогоплательщики представляют налоговую декларацию за октябрь 2026 г.</p>  ", title:"Налог на игорный бизнес"},{message: "<p><strong>Индивидуальный (персонифицированный) учет:</strong></p> <p>- страхователи представляют в составе формы ЕФС-1 сведения о трудовой деятельности работников в случаях их перевода на другую постоянную работу, подачи заявления о продолжении ведения страхователем трудовой книжки в соответствии со статьей 66 Трудового кодекса либо о предоставлении ему страхователем сведений о трудовой деятельности в соответствии со статьей 66.1 Трудового кодекса за октябрь 2026 г.;</p> <p>- государственные и муниципальные учреждения, осуществляющие определенные виды деятельности, представляют в составе формы ЕФС-1 сведения о размере выплат в отношении лиц, работающих по трудовым договорам, за октябрь 2026 г.</p>  ", title:"Индивидуальный (персонифицированный) учет"},{message: "<p><strong>Единый налоговый платеж:</strong></p> <p>- налогоплательщики, плательщики сборов, налоговые агенты, плательщики страховых взносов представляют в налоговый орган уведомление об исчисленных суммах налогов, авансовых платежей по налогам, сборов, страховых взносов</p>  ", title:"Единый налоговый платеж"},{message: "<p><strong>Акцизы:</strong></p> <p>- налогоплательщики, совершающие операции с нефтяным сырьем, представляют декларацию за октябрь 2026 г.;</p> <p>- налогоплательщики (кроме имеющих свидетельство о регистрации лица, совершающего операции с прямогонным бензином, о регистрации лица, совершающего операции с бензолом, параксилолом или ортоксилолом, о регистрации организации, совершающей операции с этиловым спиртом, о регистрации лица, совершающего операции по переработке средних дистиллятов, а также включенных в Реестр эксплуатантов гражданской авиации Российской Федерации и имеющих сертификат (свидетельство) эксплуатанта) представляют налоговую декларацию за октябрь 2026 г.;</p> <p>- налогоплательщики, имеющие свидетельство о регистрации лица, совершающего операции с прямогонным бензином, о регистрации лица, совершающего операции с бензолом, параксилолом или ортоксилолом, о регистрации организации, совершающей операции с этиловым спиртом, о регистрации лица, совершающего операции по переработке средних дистиллятов, а также включенные в Реестр эксплуатантов гражданской авиации Российской Федерации и имеющие сертификат (свидетельство) эксплуатанта, представляют налоговую декларацию за август 2026 г.;</p> <p>- налогоплательщики, совершающие операции по реализации бункерного топлива и средних дистиллятов, включенные в реестр поставщиков бункерного топлива, представляют налоговую декларацию за май 2026 г.</p>  ", title:"Акцизы"},{message: "<p><strong>Налог на прибыль организаций:</strong></p> <p>- налогоплательщики, исчисляющие ежемесячные авансовые платежи исходя из фактически полученной прибыли, представляют налоговую декларацию за октябрь 2026 г.</p>  ", title:"Налог на прибыль организаций"},{message: "<p><strong>Автоматизированная упрощенная система налогообложения:</strong></p> <p>- налогоплательщики уплачивают налог за октябрь 2026 г.;</p> <p>- налоговые агенты, в случае выплаты доходов работникам минуя уполномоченную кредитную организацию, представляют в налоговые органы через личный кабинет налогоплательщика сведения о выплаченных доходах, вычетах, об исчисленных, удержанных и перечисленных суммах НДФЛ по каждому работнику за период с 23 октября по 22 ноября 2026 г.</p>", title:"Автоматизированная упрощенная система налогообложения"}]},{date: new Date(2026, 10, 30),data: [ {message: "<p><strong>Налог на доходы физических лиц:</strong></p> <p>- налоговые агенты перечисляют суммы исчисленного и удержанного налога за период с 1 по 22 ноября 2026 г.</p>  ", title:"Налог на доходы физических лиц"},{message: "<p><strong>Страховые взносы на обязательное социальное, пенсионное, медицинское страхование:</strong></p> <p>- плательщики страховых взносов уплачивают взносы в ФНС за октябрь 2026 г.</p>  ", title:"Страховые взносы на обязательное социальное, пенсионное, медицинское страхование"},{message: "<p><strong>НДС:</strong></p> <p>- налогоплательщики уплачивают 1/3 суммы налога за III квартал 2026 г.</p>  ", title:"НДС"},{message: "<p><strong>Налог на добычу полезных ископаемых:</strong></p> <p>- налогоплательщики уплачивают налог за октябрь 2026 г.</p>  ", title:"Налог на добычу полезных ископаемых"},{message: "<p><strong>Акцизы:</strong></p> <p>- налогоплательщики, совершающие операции с нефтяным сырьем, уплачивают акцизы за октябрь 2026 г.;</p> <p>- налогоплательщики (кроме имеющих свидетельство о регистрации лица, совершающего операции с прямогонным бензином, о регистрации лица, совершающего операции с бензолом, параксилолом или ортоксилолом, о регистрации организации, совершающей операции с этиловым спиртом, о регистрации лица, совершающего операции по переработке средних дистиллятов, а также включенных в Реестр эксплуатантов гражданской авиации Российской Федерации и имеющих сертификат (свидетельство) эксплуатанта) уплачивают акцизы за октябрь 2026 г.;</p> <p>- налогоплательщики, имеющие свидетельство о регистрации лица, совершающего операции с прямогонным бензином, о регистрации лица, совершающего операции с бензолом, параксилолом или ортоксилолом, о регистрации организации, совершающей операции с этиловым спиртом, о регистрации лица, совершающего операции по переработке средних дистиллятов, а также включенные в Реестр эксплуатантов гражданской авиации Российской Федерации и имеющие сертификат (свидетельство) эксплуатанта, уплачивают акцизы за август 2026 г.;</p> <p>- налогоплательщики, совершающие операции по реализации бункерного топлива и средних дистиллятов, включенные в реестр поставщиков бункерного топлива, уплачивают акцизы за май 2026 г.;</p> <p>- налогоплательщики, осуществляющие на территории Российской Федерации производство алкогольной продукции и (или) подакцизной спиртосодержащей продукции, уплачивают авансовый платеж за ноябрь 2026 г.и представляют в налоговый орган документы, подтверждающие уплату авансового платежа. В целях освобождения от уплаты авансового платежа акциза налогоплательщики представляют в налоговый орган банковскую гарантию и извещение об освобождении от уплаты авансового платежа акциза</p>  ", title:"Акцизы"},{message: "<p><strong>Налог на игорный бизнес:</strong></p> <p>- налогоплательщики уплачивают налог за октябрь 2026 г.</p>  ", title:"Налог на игорный бизнес"},{message: "<p><strong>Налог на прибыль организаций:</strong></p> <p>- налоговые агенты перечисляют налог с доходов в виде дивидендов, а также процентов по государственным и муниципальным ценным бумагам, удержанный в октябре 2026 г.;</p> <p>- налогоплательщики уплачивают налог с доходов в виде процентов по государственным и муниципальным ценным бумагам за октябрь 2026 г.;</p> <p>- налогоплательщики уплачивают 2-й ежемесячный авансовый платеж по налогу за IV квартал 2026 г. (об организациях, уплачивающих только квартальные авансовые платежи, см. ст. 286 НК РФ);</p> <p>- налогоплательщики, исчисляющие ежемесячные авансовые платежи исходя из фактически полученной прибыли, уплачивают авансовый платеж за октябрь 2026 г.</p> <p>- организации, осуществляющие образовательную и (или) медицинскую деятельность, подают в налоговый орган заявление, копии лицензии (лицензий) на осуществление образовательной и (или) медицинской деятельности для применения налоговой ставки 0 % в 2027 году;</p> <p>- организации, осуществляющие социальное обслуживание граждан, подают в налоговый орган заявление, а также сведения, подтверждающие выполнение установленных условий, для применения налоговой ставки 0 % в 2027 году</p>  ", title:"Налог на прибыль организаций"},{message: "<p><stro  ведения страхователем трудовой книжки в соответствии со статьей 66 Трудового кодекса либо о предоставлении ему страхователем сведений о трудовой деятельности в соответствии со статьей 66.1 Трудового кодекса за ноябрь 2026 г.;</p> <p>- государственные и муниципальные учреждения, осуществляющие определенные виды деятельности, представляют в составе формы ЕФС-1 сведения о размере выплат в отношении лиц, работающих по трудовым договорам, за ноябрь 2026 г.</p>  ", title:"Индивидуальный (персонифицированный) учет"},{message: "<p><strong>Налог на прибыль организаций:</strong></p> <p>- налогоплательщики, исчисляющие ежемесячные авансовые платежи исходя из фактически полученной прибыли, представляют налоговую декларацию за ноябрь 2026 г.</p>  ", title:"Налог на прибыль организаций"},{message: "<p><strong>Акцизы:</strong></p> <p>- налогоплательщики, совершающие операции с нефтяным сырьем, представляют декларацию за ноябрь 2026 г.;</p> <p>- налогоплательщики (кроме имеющих свидетельство о регистрации лица, совершающего операции с прямогонным бензином, о регистрации лица, совершающего операции с бензолом, параксилолом или ортоксилолом, о регистрации организации, совершающей операции с этиловым спиртом, о регистрации лица, совершающего операции по переработке средних дистиллятов, а также включенных в Реестр эксплуатантов гражданской авиации Российской Федерации и имеющих сертификат (свидетельство) эксплуатанта) представляют налоговую декларацию за ноябрь 2026 г.;</p> <p>- налогоплательщики, имеющие свидетельство о регистрации лица, совершающего операции с прямогонным бензином, о регистрации лица, совершающего операции с бензолом, параксилолом или ортоксилолом, о регистрации организации, совершающей операции с этиловым спиртом, о регистрации лица, совершающего операции по переработке средних дистиллятов, а также включенные в Реестр эксплуатантов гражданской авиации Российской Федерации и имеющие сертификат (свидетельство) эксплуатанта, представляют налоговую декларацию за сентябрь 2026 г.;</p> <p>- налогоплательщики, совершающие операции по реализации бункерного топлива и средних дистиллятов, включенные в реестр поставщиков бункерного топлива, представляют налоговую декларацию за июнь 2026 г.</p>  ", title:"Акцизы"},{message: "<p><strong>Налог на добычу полезных ископаемых:</strong></p> <p>- налогоплательщики представляют налоговую декларацию за ноябрь 2026 г.</p>  ", title:"Налог на добычу полезных ископаемых"},{message: "<p><strong>Налог на игорный бизнес:</strong></p> <p>- налогоплательщики представляют налоговую декларацию за ноябрь 2026 г.</p>  ", title:"Налог на игорный бизнес"},{message: "<p><strong>Автоматизированная упрощенная система налогообложения:</strong></p> <p>- налогоплательщики уплачивают налог за ноябрь 2026 г.;</p> <p>- налоговые агенты, в случае выплаты доходов работникам минуя уполномоченную кредитную организацию, представляют в налоговые органы через личный кабинет налогоплательщика сведения о выплаченных доходах, вычетах, об исчисленных, удержанных и перечисленных суммах НДФЛ по каждому работнику за период с 23 ноября по 22 декабря 2026 г.</p>", title:"Автоматизированная упрощенная система налогообложения"}]},{date: new Date(2026, 11, 28),data: [ {message: "<p><strong>Налог на доходы физических лиц:</strong></p> <p>- налоговые агенты перечисляют суммы исчисленного и удержанного налога за период с 1 по 22 декабря 2026 г.</p>  ", title:"Налог на доходы физических лиц"},{message: "<p><strong>Страховые взносы на обязательное социальное, пенсионное, медицинское страхование:</strong></p> <p>- плательщики страховых взносов уплачивают взносы в ФНС за ноябрь 2026 г.</p> <p>- плательщики страховых взносов, не производящие выплат и иных вознаграждений физическим лицам, уплачивают взносы за 2026 г. на обязательное пенсионное страхование (с суммы дохода не более 300000 рублей) и на обязательное медицинское страхование</p>  ", title:"Страховые взносы на обязательное социальное, пенсионное, медицинское страхование"},{message: "<p>
