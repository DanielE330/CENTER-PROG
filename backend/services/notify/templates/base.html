<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f4f6f5;font-family:Inter,Segoe UI,Arial,sans-serif;color:#1c2420">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f5">
<tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e7e4;border-radius:12px">
<tr><td style="padding:20px 28px;border-bottom:1px solid #e2e7e4">
<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#176b45;margin-right:8px"></span><strong style="font-size:15px;color:#176b45">{{ product }}</strong>
</td></tr>
<tr><td style="padding:24px 28px;font-size:15px;line-height:1.55">
{% block body %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 28px;border-top:1px solid #e2e7e4;font-size:12px;line-height:1.5;color:#66716a">
{% block footer %}Письмо отправлено автоматически, отвечать на него не нужно.{% endblock %}
{% if unsubscribe_url %}<br><a href="{{ settings_url }}" style="color:#66716a">Настроить уведомления</a> · <a href="{{ unsubscribe_url }}" style="color:#66716a">Отписаться</a>{% endif %}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
