{% macro button(url, label) %}<table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0"><tr><td style="background:#176b45;border-radius:8px"><a href="{{ url }}" style="display:inline-block;padding:11px 20px;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px">{{ label }}</a></td></tr></table>
<p style="font-size:12px;color:#66716a;margin:0">Если кнопка не работает, скопируйте ссылку в браузер:<br><a href="{{ url }}" style="color:#176b45;word-break:break-all">{{ url }}</a></p>{% endmacro %}
