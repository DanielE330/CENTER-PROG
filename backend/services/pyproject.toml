[project]
name = "ci1-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "asn1crypto>=1.5.1",
  "httpx>=0.27",
  "matplotlib>=3.9",
  "tzdata>=2024.1",
  "pyyaml>=6",
  "gostcrypto>=1.2.5",
  "segno>=1.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# модель на хвост категорий (ставится только в образ parser)
tail = ["scikit-learn>=1.5"]
# ML-лаборатория (бэктест, challenger-модели): в образы сервисов не попадает, ставится `uv sync --group ml`
ml = ["numpy>=2", "pandas>=2.2", "scikit-learn>=1.5", "statsforecast>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
