# GitHub has no fast-forward merge for pull requests: merge, squash and rebase
# all create new commits. stable must point at the exact commit that passed CI
# on tested, so this workflow moves stable itself. Once stable contains the PR
# head, GitHub marks the open tested → stable PR as merged.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so release
# steps (image re-tagging, signing, GitHub Release) belong in this file.
name: promote

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tested
          fetch-depth: 0

      - name: Require an approved PR tested → stable for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          pr=$(gh pr list --repo "$REPO" --base stable --head tested --state open \
            --json number,headRefOid --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "::error::open a PR tested → stable first"
            exit 1
          fi
          number=$(jq -r .number <<<"$pr")
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$head" ]; then
            echo "::error::PR #$number does not point at tested HEAD $head"
            exit 1
          fi
          approvals=$(gh pr view "$number" --repo "$REPO" --json reviews \
            --jq "[.reviews[] | select(.state == \"APPROVED\" and .commit.oid == \"$head\")] | length")
          if [ "$approvals" -lt 1 ]; then
            echo "::error::PR #$number has no approval for $head"
            exit 1
          fi

      - name: Fast-forward stable to tested
        run: |
          set -euo pipefail
          git fetch origin stable
          if ! git merge-base --is-ancestor origin/stable HEAD; then
            echo "::error::stable has commits that are not in tested"
            exit 1
          fi
          git push origin HEAD:refs/heads/stable
          echo "stable → $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
