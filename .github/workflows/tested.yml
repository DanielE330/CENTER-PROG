# On every merge into tested: build each image once, push it with the commit tag,
# sign it keylessly and attach build provenance. promote.yml re-tags these digests.
name: tested
on:
  push:
    branches: [tested]

permissions: {}

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, file: deploy/docker/rust.Dockerfile }
          - { name: tenancy, file: deploy/docker/rust.Dockerfile }
          - { name: ingest, file: deploy/docker/rust.Dockerfile }
          - { name: obligations, file: deploy/docker/rust.Dockerfile }
          - { name: alerts, file: deploy/docker/rust.Dockerfile }
          - { name: llm-gateway, file: deploy/docker/rust.Dockerfile }
          - { name: advisor-tools, file: deploy/docker/rust.Dockerfile }
          - { name: categorizer, file: deploy/docker/python.Dockerfile }
          - { name: forecast, file: deploy/docker/python.Dockerfile }
          - { name: connectors, file: deploy/docker/python.Dockerfile }
          - { name: advisor, file: deploy/docker/advisor.Dockerfile }
          - { name: web, file: deploy/docker/web.Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ci1-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: SERVICE=${{ matrix.name }}
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }},${{ env.IMAGE }}:tested
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          sbom: true
          provenance: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # Attestations are not available for user-owned private repositories; cosign still signs.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan the pushed image (trivy)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm aquasec/trivy:0.76.1 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${IMAGE}@${DIGEST}"
