name: security
on:
  push:
    branches: [main, testing]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# TODO: инструменты ниже ещё не запускались локально (нет docker-демона/установки). После первого прогона разобрать замечания
# и убрать continue-on-error. Секреты и токены не нужны.
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secrets in history (gitleaks)
        continue-on-error: true
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --no-banner --redact
      - name: SAST (semgrep)
        continue-on-error: true
        run: pipx run semgrep==1.182.1 scan --config p/rust --config p/python --config p/typescript --config p/secrets --error --metrics off --exclude gleb
      - name: Dockerfiles (hadolint)
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src" -w /src hadolint/hadolint:v2.15.1 hadolint --ignore DL3008 infra/docker/*.Dockerfile
      - name: Filesystem (trivy fs)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.1 fs --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile /src/.trivyignore \
            --skip-dirs /src/gleb --skip-dirs /src/data --skip-dirs /src/backend/target --skip-dirs /src/frontend/node_modules /src
      - name: Config (trivy config)
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.1 config --severity HIGH,CRITICAL --exit-code 1 --ignorefile /src/.trivyignore /src/infra
